name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_password_change_me
          POSTGRES_DB: customer_support_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5435
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_change_me
      POSTGRES_DB: customer_support_db
      SECRET_KEY: test_secret_jwt_key_for_ci_testing_purposes_only
      AGENT_SERVICE_SECRET: agent_internal_service_secret_key_2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pip install -r requirements.txt

      - name: Run Database Migrations & Seeds
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          alembic upgrade head
          python scripts/seed.py

      - name: Run Tests (Pytest)
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest -v

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
